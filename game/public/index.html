<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Game</title>
    <style>
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            font-family: system-ui, sans-serif;
            color: #fff;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none
        }
        
        canvas {
            display: block
        }
        
        .scr {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(#3a7bd5, #1e3c72);
            z-index: 10;
            padding: 16px;
            text-align: center
        }
        
        .scr input {
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            border: 0;
            width: 260px;
            text-align: center
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: 0;
            border-radius: 8px;
            background: #ffd54a;
            font-weight: 700;
            cursor: pointer
        }
        
        .cards {
            display: flex;
            gap: 16px
        }
        
        .card {
            background: #fff2;
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer
        }
        
        .card img {
            height: min(200px, 30vh)
        }
        
        .card:hover {
            border-color: #ffd54a
        }
        
        #e1 {
            color: #ffb4b4;
            min-height: 20px
        }
        
        #chat {
            position: fixed;
            left: 8px;
            bottom: 8px;
            width: min(360px, 60vw);
            z-index: 5
        }
        
        #log {
            max-height: 160px;
            overflow-y: auto;
            background: #0008;
            border-radius: 8px 8px 0 0;
            padding: 6px;
            font-size: 14px;
            user-select: text
        }
        
        #log b {
            color: #8cf
        }
        
        #log .ad b {
            color: #ffd54a
        }
        
        #log .sy {
            color: #ccc;
            font-style: italic
        }
        
        #cin {
            width: 100%;
            padding: 8px;
            border: 0;
            border-radius: 0 0 8px 8px;
            font-size: 15px
        }
        
        @media(pointer:coarse) {
            #chat {
                bottom: auto;
                top: 8px;
                width: 46vw
            }
            #log {
                max-height: 80px;
                font-size: 12px
            }
        }
        
        #hud {
            position: fixed;
            right: 10px;
            top: 10px;
            background: #0007;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 5;
            text-align: right
        }
        
        #help {
            position: fixed;
            bottom: 8px;
            right: 10px;
            font-size: 12px;
            color: #fffa;
            z-index: 4;
            text-align: right
        }
        
        #rs {
            position: fixed;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            z-index: 6;
            display: none;
            text-align: center;
            font-size: 22px;
            text-shadow: 0 2px 4px #000
        }
        
        #joy {
            position: fixed;
            left: 24px;
            bottom: 24px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #fff3;
            border: 3px solid #fff8;
            display: none;
            z-index: 5
        }
        
        #knob {
            position: absolute;
            left: 38px;
            top: 38px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #fffc
        }
        
        #btns {
            position: fixed;
            right: 20px;
            bottom: 24px;
            display: none;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
            z-index: 5
        }
        
        #atkb {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: #e53935;
            color: #fff;
            font-size: 18px
        }
        
        #adm {
            position: fixed;
            right: 10px;
            top: 56px;
            display: none;
            gap: 6px;
            z-index: 5
        }
        
        #ap {
            position: fixed;
            right: 10px;
            top: 96px;
            width: min(330px, 92vw);
            max-height: 60vh;
            overflow: auto;
            background: #000c;
            border-radius: 10px;
            padding: 8px;
            z-index: 7;
            display: none;
            font-size: 13px
        }
        
        #ap .r {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 0;
            border-bottom: 1px solid #fff2
        }
        
        #ap .r span {
            flex: 1
        }
        
        #ap button {
            padding: 3px 6px;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div id="s1" class="scr">
        <h1>Game</h1>
        <input id="nm" maxlength="16" placeholder="Đặt tên của bạn"><input id="pw" type="password" placeholder="Mật khẩu (chỉ dành cho admin)">
        <button id="go">Tiếp tục</button>
        <div id="e1"></div>
    </div>
    <div id="s2" class="scr" style="display:none">
        <h2>Chọn nhân vật</h2>
        <div class="cards">
            <div class="card" data-c="quoc"><img src="img/quoc.png">
                <h3>Quốc</h3>
            </div>
            <div class="card" data-c="huy"><img src="img/huy.png">
                <h3>Huy</h3>
            </div>
        </div>
    </div>
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="rs"></div>
    <div id="help">WASD: di chuyển · Click: đánh · Enter: chat</div>
    <div id="chat">
        <div id="log"></div><input id="cin" maxlength="200" placeholder="Nhấn Enter để chat..." autocomplete="off"></div>
    <div id="adm"><button id="flyb">🕊 Bay (F)</button><button id="apb">🛠 Quản lý (Tab)</button></div>
    <div id="ap"></div>
    <div id="joy">
        <div id="knob"></div>
    </div>
    <div id="btns"><button id="atkb">ĐÁNH</button></div>
    <script>
        const $ = id => document.getElementById(id),
            cv = $('cv'),
            ctx = cv.getContext('2d');
        const IM = {
            quoc: new Image(),
            huy: new Image()
        };
        IM.quoc.src = 'img/quoc.png';
        IM.huy.src = 'img/huy.png';
        let B = [],
            BL = [],
            ws, myId, isAdmin = false,
            ents = new Map(),
            bullets = [],
            floats = [],
            W = 2400,
            H = 1600,
            name = '',
            pw = '',
            me = null;
        const keys = {},
            joy = {
                x: 0,
                y: 0
            };
        let lastAng = 0,
            mouse = {
                x: 0,
                y: 0,
                down: false
            },
            lastSent = '';

        function resize() {
            cv.width = innerWidth;
            cv.height = innerHeight
        }
        resize();
        addEventListener('resize', resize);

        $('go').onclick = () => {
            name = $('nm').value.trim();
            pw = $('pw').value;
            if (name.length < 2) {
                $('e1').textContent = 'Tên phải từ 2 ký tự';
                return
            }
            $('s1').style.display = 'none';
            $('s2').style.display = 'flex'
        };
        $('nm').onkeydown = e => {
            if (e.key === 'Enter') $('go').click()
        };
        document.querySelectorAll('.card').forEach(c => c.onclick = () => connect(c.dataset.c));

        function connect(ch) {
            ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
            ws.onopen = () => ws.send(JSON.stringify({
                t: 'login',
                name,
                pw,
                char: ch
            }));
            ws.onmessage = e => onMsg(JSON.parse(e.data));
            ws.onclose = () => {
                if (myId) {
                    alert('Mất kết nối server');
                    location.reload()
                }
            };
        }
        const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

        function log(html, cls) {
            const d = document.createElement('div');
            d.className = cls || '';
            d.innerHTML = html;
            $('log').appendChild(d);
            $('log').scrollTop = 1e9
        }
        const esc = s => s.replace(/[&<>"]/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;'
        }[c]));

        function onMsg(m) {
            if (m.t === 'err') {
                $('s2').style.display = 'none';
                $('s1').style.display = 'flex';
                $('e1').textContent = m.m;
                ws.close();
                ws = null
            } else if (m.t === 'init') {
                myId = m.id;
                isAdmin = m.admin;
                W = m.W;
                H = m.H;
                B = m.b;
                BL = B.map((b, i) => ({
                    bd: b,
                    bi: i,
                    y: b[1] + b[3]
                }));
                $('s2').style.display = 'none';
                if (isAdmin) $('adm').style.display = 'flex'
            } else if (m.t === 'kicked') {
                myId = null;
                alert(m.m);
                location.reload()
            } else if (m.t === 's') {
                const seen = new Set();
                for (const e of m.e) {
                    seen.add(e.i);
                    let o = ents.get(e.i);
                    if (!o) {
                        o = {
                            id: e.i,
                            x: e.x,
                            y: e.y,
                            walk: 0,
                            rot: 0,
                            atkAt: -1e9,
                            hitAt: -1e9,
                            af: 1
                        };
                        ents.set(e.i, o)
                    }
                    if (e.d && !o.d) o.deadAt = performance.now();
                    Object.assign(o, {
                        n: e.n,
                        c: e.c,
                        tx: e.x,
                        ty: e.y,
                        h: e.h,
                        m: e.m,
                        f: e.f,
                        d: e.d,
                        fl: e.fl,
                        ad: e.ad,
                        np: e.np
                    })
                }
                for (const k of ents.keys())
                    if (!seen.has(k)) ents.delete(k);
                bullets = m.b;
                me = ents.get(myId) || null;
                $('hud').textContent = 'Online: ' + [...ents.values()].filter(e => !e.np).length + (me ? '  ❤ ' + Math.max(0, me.h) + '/' + me.m : '');
            } else if (m.t === 'atk') {
                const o = ents.get(m.id);
                if (o) {
                    o.atkAt = performance.now();
                    o.af = m.f
                }
            } else if (m.t === 'dmg') {
                const o = ents.get(m.id);
                if (o) {
                    o.hitAt = performance.now();
                    floats.push({
                        x: o.x,
                        y: o.y - 140,
                        v: m.v,
                        t: performance.now()
                    })
                }
            } else if (m.t === 'chat') log('<b>' + (m.ad ? '👑 ' : '') + esc(m.name) + ':</b> ' + esc(m.text), m.ad ? 'ad' : '');
            else if (m.t === 'sys') log(esc(m.text), 'sy');
            else if (m.t === 'accounts') renderAdmin(m.l);
        }
        // ---- chat ----
        $('cin').onkeydown = e => {
            e.stopPropagation();
            if (e.key === 'Enter') {
                const t = $('cin').value.trim();
                if (t) send({
                    t: 'chat',
                    text: t
                });
                $('cin').value = '';
                $('cin').blur()
            } else if (e.key === 'Escape') $('cin').blur()
        };
        // ---- input ----
        addEventListener('keydown', e => {
            if (!myId || document.activeElement === $('cin')) return;
            const k = e.key.toLowerCase();
            if (k === 'enter') {
                e.preventDefault();
                $('cin').focus();
                return
            }
            if (k === 'f' && isAdmin) send({
                t: 'fly'
            });
            if (k === 'tab' && isAdmin) {
                e.preventDefault();
                toggleAP()
            }
            keys[k] = true
        });
        addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        addEventListener('blur', () => {
            for (const k in keys) keys[k] = false
        });
        cv.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY
        });
        cv.addEventListener('mousedown', e => {
            if (e.button !== 0) return;
            $('cin').blur();
            mouse.down = true;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouseAtk()
        });
        addEventListener('mouseup', () => mouse.down = false);
        addEventListener('contextmenu', e => e.preventDefault());

        function mouseAtk() {
            if (!me) return;
            const ang = Math.atan2(mouse.y - (me.sy - 60), mouse.x - me.sx);
            lastAng = ang;
            send({
                t: 'attack',
                a: ang
            })
        }
        setInterval(() => {
            if (mouse.down) mouseAtk()
        }, 120);

        function inputVec() {
            let x = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joy.x,
                y = (keys.s ? 1 : 0) - (keys.w ? 1 : 0) + joy.y;
            const l = Math.hypot(x, y);
            if (l > 1) {
                x /= l;
                y /= l
            }
            if (l > .15) lastAng = Math.atan2(y, x);
            return {
                x,
                y
            }
        }
        setInterval(() => {
            if (!myId) return;
            const v = inputVec(),
                s = v.x.toFixed(2) + ',' + v.y.toFixed(2);
            if (s !== lastSent) {
                lastSent = s;
                send({
                    t: 'input',
                    x: v.x,
                    y: v.y
                })
            }
        }, 33);
        // touch
        const touchMode = () => {
            $('joy').style.display = 'block';
            $('btns').style.display = 'flex';
            $('help').style.display = 'none'
        };
        if (matchMedia('(pointer:coarse)').matches) touchMode();
        addEventListener('touchstart', touchMode, {
            once: true
        });
        let jid = null;
        const jr = () => $('joy').getBoundingClientRect();

        function jmove(t) {
            const r = jr(),
                cx = r.left + r.width / 2,
                cy = r.top + r.height / 2;
            let dx = t.clientX - cx,
                dy = t.clientY - cy;
            const l = Math.hypot(dx, dy),
                R = 50;
            if (l > R) {
                dx *= R / l;
                dy *= R / l
            }
            joy.x = dx / R;
            joy.y = dy / R;
            $('knob').style.transform = `translate(${dx}px,${dy}px)`
        }
        $('joy').addEventListener('touchstart', e => {
            e.preventDefault();
            jid = e.changedTouches[0].identifier;
            jmove(e.changedTouches[0])
        }, {
            passive: false
        });
        addEventListener('touchmove', e => {
            for (const t of e.changedTouches)
                if (t.identifier === jid) {
                    e.preventDefault();
                    jmove(t)
                }
        }, {
            passive: false
        });
        addEventListener('touchend', e => {
            for (const t of e.changedTouches)
                if (t.identifier === jid) {
                    jid = null;
                    joy.x = joy.y = 0;
                    $('knob').style.transform = ''
                }
        });
        let atkTimer;
        const stopA = () => clearInterval(atkTimer);
        $('atkb').addEventListener('touchstart', e => {
            e.preventDefault();
            const f = () => send({
                t: 'attack',
                a: lastAng
            });
            f();
            atkTimer = setInterval(f, 150)
        }, {
            passive: false
        });
        $('atkb').addEventListener('touchend', stopA);
        $('atkb').addEventListener('touchcancel', stopA);
        // ---- admin ----
        $('flyb').onclick = () => send({
            t: 'fly'
        });
        $('apb').onclick = toggleAP;
        let apTimer;

        function toggleAP() {
            const a = $('ap');
            if (a.style.display === 'block') {
                a.style.display = 'none';
                clearInterval(apTimer)
            } else {
                a.style.display = 'block';
                send({
                    t: 'admin',
                    cmd: 'list'
                });
                apTimer = setInterval(() => send({
                    t: 'admin',
                    cmd: 'list'
                }), 2000)
            }
        }

        function renderAdmin(l) {
            const a = $('ap');
            a.textContent = '';
            l.forEach(u => {
                const r = document.createElement('div');
                r.className = 'r';
                const s = document.createElement('span');
                s.textContent = (u.on ? '🟢 ' : '⚪ ') + u.n;
                r.appendChild(s);
                if (u.n !== 'admin') {
                    [
                        ['Hồi', 'heal', u.on],
                        ['Giết', 'kill', u.on],
                        ['Kick', 'kick', u.on],
                        ['Xóa', 'del', 1]
                    ].forEach(([t, c, en]) => {
                        if (!en) return;
                        const b = document.createElement('button');
                        b.textContent = t;
                        b.onclick = () => {
                            if (c !== 'del' || confirm('Xóa tài khoản ' + u.n + '?')) send({
                                t: 'admin',
                                cmd: c,
                                name: u.n
                            })
                        };
                        r.appendChild(b)
                    })
                }
                a.appendChild(r)
            })
        }
        // ---- render ----
        const RX = [300, 2100],
            RY = [300, 1300],
            RW = 110,
            WALL = ['#5f7f99', '#3d5a73', '#7c8fa3', '#2f4858', '#6b7f8f', '#4a6572'];

        function drawGround() {
            ctx.fillStyle = '#9aa7b0';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#cfd8dc';
            ctx.fillRect(760, 460, 880, 680);
            ctx.strokeStyle = '#b0bec5';
            ctx.lineWidth = 2;
            for (let x = 760; x <= 1640; x += 80) {
                ctx.beginPath();
                ctx.moveTo(x, 460);
                ctx.lineTo(x, 1140);
                ctx.stroke()
            }
            for (let y = 460; y <= 1140; y += 80) {
                ctx.beginPath();
                ctx.moveTo(760, y);
                ctx.lineTo(1640, y);
                ctx.stroke()
            }
            ctx.fillStyle = '#4fc3f7';
            ctx.strokeStyle = '#eceff1';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.ellipse(1200, 790, 60, 30, 0, 0, 7);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#2b2f36';
            RY.forEach(y => ctx.fillRect(0, y - RW / 2, W, RW));
            RX.forEach(x => ctx.fillRect(x - RW / 2, 0, RW, H));
            ctx.strokeStyle = '#ffd54a';
            ctx.lineWidth = 3;
            ctx.setLineDash([30, 24]);
            RY.forEach(y => {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke()
            });
            RX.forEach(x => {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke()
            });
            ctx.setLineDash([]);
        }
        const VEH = [];
        (function() {
            let s = 7;
            const r = () => (s = (s * 16807) % 2147483647) / 2147483647,
                cols = ['#e53935', '#1e88e5', '#fdd835', '#43a047', '#eceff1', '#8e24aa', '#ff7043'],
                L = [];
            RY.forEach(y => L.push({
                h: 1,
                c: y - 26,
                d: 1
            }, {
                h: 1,
                c: y + 26,
                d: -1
            }));
            RX.forEach(x => L.push({
                h: 0,
                c: x - 26,
                d: 1
            }, {
                h: 0,
                c: x + 26,
                d: -1
            }));
            L.forEach(l => {
                for (let i = 0; i < 5; i++) {
                    const m = r() < .35;
                    VEH.push({...l,
                        m,
                        p: r() * 3000,
                        sp: (m ? 210 : 160) + r() * 60,
                        col: cols[r() * 7 | 0]
                    })
                }
            })
        })();

        function drawVeh(t) {
            for (const v of VEH) {
                const len = (v.h ? W : H) + 300,
                    p = (((v.p + v.sp * t * v.d) % len) + len) % len - 150,
                    x = v.h ? p : v.c,
                    y = v.h ? v.c : p;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(v.h ? (v.d > 0 ? 0 : Math.PI) : (v.d > 0 ? Math.PI / 2 : -Math.PI / 2));
                if (!v.m) {
                    ctx.fillStyle = 'rgba(0,0,0,.35)';
                    ctx.fillRect(-33, -12, 70, 34);
                    ctx.fillStyle = v.col;
                    ctx.fillRect(-35, -16, 70, 32);
                    ctx.fillStyle = '#1c2833';
                    ctx.fillRect(4, -13, 14, 26);
                    ctx.fillRect(-22, -13, 10, 26);
                    ctx.fillStyle = 'rgba(0,0,0,.18)';
                    ctx.fillRect(-12, -14, 16, 28);
                    ctx.fillStyle = '#fff59d';
                    ctx.fillRect(33, -14, 3, 7);
                    ctx.fillRect(33, 7, 3, 7);
                    ctx.fillStyle = '#ff1744';
                    ctx.fillRect(-36, -14, 3, 7);
                    ctx.fillRect(-36, 7, 3, 7)
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,.35)';
                    ctx.fillRect(-16, -4, 36, 16);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(-20, -3, 10, 6);
                    ctx.fillRect(12, -3, 10, 6);
                    ctx.fillStyle = v.col;
                    ctx.fillRect(-14, -5, 28, 10);
                    ctx.fillStyle = '#ffb74d';
                    ctx.beginPath();
                    ctx.ellipse(-2, 0, 6, 12, 0, 0, 7);
                    ctx.fill();
                    ctx.fillStyle = '#222';
                    ctx.beginPath();
                    ctx.arc(1, 0, 7, 0, 7);
                    ctx.fill();
                    ctx.fillStyle = '#fff59d';
                    ctx.fillRect(21, -2, 3, 4)
                }
                ctx.restore()
            }
        }

        function drawBuilding(o, cx, cy, cw, ch, now) {
            const [x, y, w, h, hg0, ci] = o.bd, hg = hg0 * .62;
            if (x > cx + cw / 2 || x + w < cx - cw / 2 || y - hg > cy + ch / 2 || y + h < cy - ch / 2) return;
            ctx.fillStyle = 'rgba(0,0,0,.25)';
            ctx.fillRect(x + 10, y + h - 4, w, 12);
            ctx.fillStyle = WALL[ci];
            ctx.fillRect(x, y + h - hg, w, hg);
            const cols = Math.floor((w - 16) / 22),
                rows = Math.floor((hg - 40) / 26);
            for (let r = 0; r < rows; r++)
                for (let k = 0; k < cols; k++) {
                    ctx.fillStyle = ((r * 7 + k * 13 + o.bi * 5) % 5) < 2 ? '#ffe082' : '#173247';
                    ctx.fillRect(x + 10 + k * 22 + (w - 16 - cols * 22) / 2, y + h - hg + 12 + r * 26, 14, 16)
                }
            ctx.fillStyle = '#0b1a26';
            ctx.fillRect(x + w / 2 - 20, y + h - 30, 40, 30);
            ctx.fillStyle = '#4dd0e1';
            ctx.fillRect(x + w / 2 - 16, y + h - 26, 32, 4);
            ctx.fillStyle = '#b0c4d4';
            ctx.fillRect(x, y - hg, w, h);
            ctx.strokeStyle = '#e3f2fd';
            ctx.lineWidth = 3;
            ctx.strokeRect(x + 1, y - hg + 1, w - 2, h - 2);
            ctx.fillStyle = '#78909c';
            ctx.fillRect(x + w * .2, y - hg + h * .3, 24, 18);
            ctx.fillRect(x + w * .55, y - hg + h * .5, 30, 20);
            if (hg0 > 340) {
                const ax = x + w / 2,
                    ay = y - hg + h / 2;
                ctx.strokeStyle = '#eceff1';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(ax, ay - 50);
                ctx.stroke();
                if (Math.floor(now / 500) % 2) {
                    ctx.fillStyle = '#ff1744';
                    ctx.beginPath();
                    ctx.arc(ax, ay - 50, 5, 0, 7);
                    ctx.fill()
                }
            }
        }
        let prev = performance.now();

        function frame(now) {
            requestAnimationFrame(frame);
            const dt = Math.min(.05, (now - prev) / 1000);
            prev = now;
            const cw = cv.width,
                ch = cv.height;
            ctx.fillStyle = '#14210f';
            ctx.fillRect(0, 0, cw, ch);
            if (!myId) {
                return
            }
            const v = inputVec();
            for (const o of ents.values()) {
                const px = o.x,
                    py = o.y;
                if (o.id === myId) {
                    if (!o.d) {
                        const sp = isAdmin ? (o.fl ? 420 : 260) : 220;
                        o.x = Math.max(30, Math.min(W - 30, o.x + v.x * sp * dt));
                        o.y = Math.max(60, Math.min(H - 30, o.y + v.y * sp * dt))
                    }
                    const ex = o.tx - o.x,
                        ey = o.ty - o.y;
                    if (Math.hypot(ex, ey) > 90) {
                        o.x = o.tx;
                        o.y = o.ty
                    } else {
                        o.x += ex * .12;
                        o.y += ey * .12
                    }
                } else {
                    const k = Math.min(1, dt * 14);
                    o.x += (o.tx - o.x) * k;
                    o.y += (o.ty - o.y) * k
                }
                const spd = Math.hypot(o.x - px, o.y - py) / Math.max(dt, .001);
                if (spd > 25 && !o.d) o.walk += dt * 12;
                o.mv = spd > 25 && !o.d;
                o.rot += ((o.d ? 1 : 0) - o.rot) * Math.min(1, dt * 9);
            }
            let cx = me ? me.x : W / 2,
                cy = me ? me.y : H / 2;
            cx = Math.max(cw / 2, Math.min(W - cw / 2, cx));
            cy = Math.max(ch / 2, Math.min(H - ch / 2, cy));
            if (W < cw) cx = W / 2;
            if (H < ch) cy = H / 2;
            const ox = cw / 2 - cx,
                oy = ch / 2 - cy;
            if (me) {
                me.sx = me.x + ox;
                me.sy = me.y + oy
            }
            ctx.save();
            ctx.translate(ox, oy);
            drawGround();
            drawVeh(Date.now() / 1000);
            const list = [...BL, ...ents.values()].sort((a, b) => a.y - b.y);
            for (const o of list) {
                o.bd ? drawBuilding(o, cx, cy, cw, ch, now) : drawEnt(o, now)
            }
            ctx.fillStyle = '#ffe066';
            for (const b of bullets) {
                ctx.beginPath();
                ctx.arc(b[0], b[1], 6, 0, 7);
                ctx.fill()
            }
            ctx.font = 'bold 22px system-ui';
            ctx.textAlign = 'center';
            floats = floats.filter(f => now - f.t < 800);
            for (const f of floats) {
                const a = 1 - (now - f.t) / 800;
                ctx.globalAlpha = a;
                ctx.fillStyle = '#ff4444';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                const y = f.y - (now - f.t) * .05;
                ctx.strokeText('-' + f.v, f.x, y);
                ctx.fillText('-' + f.v, f.x, y)
            }
            ctx.globalAlpha = 1;
            ctx.restore();
            const rs = $('rs');
            if (me && me.d) {
                const s = 2.5 - (now - me.deadAt) / 1000;
                rs.style.display = 'block';
                rs.innerHTML = s > 0 ? 'Bạn đã ngã! Hồi sinh sau ' + Math.ceil(s) + 's' : '<button id="rb" style="font-size:22px">Hồi sinh</button>';
                const b = $('rb');
                if (b) b.onclick = () => send({
                    t: 'respawn'
                })
            } else rs.style.display = 'none';
        }

        function drawTree(t) {
            ctx.fillStyle = '#0003';
            ctx.beginPath();
            ctx.ellipse(t.x, t.y, 28, 9, 0, 0, 7);
            ctx.fill();
            ctx.fillStyle = '#6b4423';
            ctx.fillRect(t.x - 7, t.y - 50, 14, 50);
            ctx.fillStyle = '#2e7d32';
            ctx.beginPath();
            ctx.arc(t.x, t.y - 70, 38, 0, 7);
            ctx.fill();
            ctx.fillStyle = '#388e3c';
            ctx.beginPath();
            ctx.arc(t.x - 10, t.y - 80, 24, 0, 7);
            ctx.fill()
        }

        function drawEnt(o, now) {
            const img = IM[o.c],
                ih = 104,
                iw = img.naturalWidth ? ih * img.naturalWidth / img.naturalHeight : 78,
                lh = 36,
                TH = ih + lh;
            const lift = o.fl ? 40 + Math.sin(now / 200) * 5 : 0,
                f = o.f || 1;
            ctx.fillStyle = 'rgba(0,0,0,.3)';
            ctx.beginPath();
            ctx.ellipse(o.x, o.y, (o.d ? 60 : 30) * (1 - lift / 160), 10, 0, 0, 7);
            ctx.fill();
            ctx.save();
            ctx.translate(o.x, o.y - lift);
            if (o.rot > .01) {
                ctx.translate(0, -20 * o.rot);
                ctx.rotate(o.rot * Math.PI / 2 * f);
                ctx.translate(0, TH / 2 * o.rot)
            }
            const ta = (now - o.atkAt) / 320,
                atk = ta >= 0 && ta < 1,
                s = atk ? Math.sin(ta * Math.PI) : 0;
            if (atk) {
                ctx.translate(o.af * 14 * s, 0);
                ctx.rotate(o.af * .18 * s)
            }
            const bob = o.mv ? Math.abs(Math.sin(o.walk)) * 4 : Math.sin(now / 400) * 1.2,
                ph = o.mv ? Math.sin(o.walk) * 10 : 0;
            ctx.rotate(o.mv ? Math.sin(o.walk) * .04 : 0);
            ctx.fillStyle = '#1f2f5a';
            const L = 4 + Math.max(0, ph),
                R = 4 + Math.max(0, -ph);
            ctx.fillRect(-19, -lh, 15, lh - L);
            ctx.fillRect(4, -lh, 15, lh - R);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-21, -L - 5, 19, 7);
            ctx.fillRect(2, -R - 5, 19, 7);
            ctx.filter = o.d ? 'grayscale(1) brightness(.75)' : (now - o.hitAt < 200 ? 'sepia(1) saturate(8) hue-rotate(-40deg)' : 'none');
            if (img.complete && img.naturalWidth) ctx.drawImage(img, -iw / 2, -TH + 4 + bob, iw, ih);
            ctx.filter = 'none';
            if (atk && !o.ad) {
                ctx.fillStyle = '#f3c9a0';
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 2;
                const fx = o.af * (20 + 55 * s),
                    fy = -TH * .55;
                ctx.beginPath();
                ctx.arc(fx, fy, 12, 0, 7);
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(o.af * 30, fy, 45, o.af > 0 ? -.9 : Math.PI - .9 + .0, o.af > 0 ? .9 : Math.PI + .9);
                ctx.stroke()
            }
            if (o.ad && !o.d) {
                const gx = f * 28,
                    gy = -TH * .45;
                ctx.fillStyle = '#222';
                ctx.fillRect(f > 0 ? gx : gx - 36, gy, 36, 9);
                ctx.fillRect(f > 0 ? gx : gx - 9, gy, 9, 18);
                if (atk && ta < .3) {
                    ctx.fillStyle = '#ffe066';
                    ctx.beginPath();
                    ctx.arc(gx + f * 42, gy + 4, 10, 0, 7);
                    ctx.fill()
                }
            }
            ctx.restore();
            const by = o.y - lift - (o.d ? 44 : TH + 16);
            ctx.fillStyle = '#000a';
            ctx.fillRect(o.x - 37, by - 1, 74, 11);
            const r = Math.max(0, o.h / o.m);
            ctx.fillStyle = o.ad ? '#ffd54a' : (r > .5 ? '#4caf50' : r > .25 ? '#ffc107' : '#f44336');
            ctx.fillRect(o.x - 36, by, 72 * r, 9);
            ctx.font = 'bold 14px system-ui';
            ctx.textAlign = 'center';
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000';
            const label = (o.ad ? '👑 ' : '') + o.n;
            ctx.strokeText(label, o.x, by - 6);
            ctx.fillStyle = o.ad ? '#ffd54a' : o.id === myId ? '#7fe3ff' : o.np ? '#e0e0e0' : '#fff';
            ctx.fillText(label, o.x, by - 6);
        }
        requestAnimationFrame(frame);
    </script>
